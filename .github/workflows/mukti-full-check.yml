name: MUKTI full application readiness

on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths:
      - 'src/**'
      - 'tests/aurora-regression/**'
      - 'tests/security-regression/**'
      - 'vendor/**'
      - 'scripts/build-reviewed-opentimestamps.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'config/eslint/**'
      - '.github/workflows/mukti-full-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mukti-full-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect local-package prerequisites and locked Git references
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [name, spec] of Object.entries({...manifest.dependencies,...manifest.devDependencies})) {
            if (spec.startsWith('file:')) {
              const local=path.resolve(spec.slice(5));
              const present=fs.existsSync(local) && (fs.statSync(local).isFile() || fs.existsSync(path.join(local,'package.json')));
              console.log(JSON.stringify({package:name,source:spec,present}));
              if (!present) throw new Error('Missing local dependency: '+name);
            }
            if (spec.startsWith('github:')) console.log(JSON.stringify({package:name,source:spec,locked:lock.packages?.['node_modules/'+name]?.resolved ?? null}));
          }
          JS
      - name: Verify pinned upstream archive and every retained source hash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          provenance=json.loads(pathlib.Path('vendor/typescript-opentimestamps-provenance.json').read_text())
          archive=pathlib.Path('vendor/typescript-opentimestamps-upstream-12ba7b2.tgz')
          assert provenance['commit']=='12ba7b2c4f4cd1b8ce52d2c17be5efedca3bceab'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==provenance['archiveSha256']
          with tarfile.open(archive) as bundle:
              for name,digest in provenance['sources'].items():
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
                  assert hashlib.sha256(bundle.extractfile('package/'+name).read()).hexdigest()==digest
              manifest=json.load(bundle.extractfile('package/package.json'))
              assert manifest['license']=='LGPL-3.0-or-later' and not manifest.get('scripts')
              assert bundle.extractfile('package/LICENSE').read()
          print('Pinned archive, original sources and retained license verified; no install scripts.')
          PY
          node --check scripts/build-reviewed-opentimestamps.cjs
      - name: Install exact dependencies with optional existing private-repository access
        id: install
        env:
          GH_PRIVATE_DEPS_TOKEN: ${{ secrets.GH_PRIVATE_DEPS_TOKEN }}
        run: |
          set -eu
          set +x
          # Process-scoped HTTPS rewrite: do not write a credential into a URL or git config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          if [ -n "${GH_PRIVATE_DEPS_TOKEN:-}" ]; then
            askpass="$(mktemp "$RUNNER_TEMP/mukti-askpass.XXXXXX")"
            trap 'rm -f "$askpass"' EXIT
            cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            "Username for 'https://github.com':"*|"Username for 'https://github.com/"*)
              printf '%s\n' 'x-access-token' ;;
            "Password for 'https://x-access-token@github.com':"*|"Password for 'https://x-access-token@github.com/"*)
              printf '%s\n' "$GH_PRIVATE_DEPS_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
            chmod 700 "$askpass"
            export GIT_ASKPASS="$askpass"
            echo 'Existing private-dependency credential enabled for installation only.'
          else
            echo '::notice::GH_PRIVATE_DEPS_TOKEN is absent; private dependencies may block installation.'
          fi
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify timestamp protocol and bounded network failure cases
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/security-regression/opentimestamps-regression.mjs
      - name: Typecheck entire application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Lint entire application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0
      - name: Build application without deployment or project credentials
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Require zero reported production dependency advisories
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --package-lock-only --omit=dev --audit-level=low

# Independent software gates, not proof of complete product or medical readiness.
# No deployment, production migration, physical output or production API keys.
# Existing download-only credential is available solely during npm ci;
# lifecycle scripts are disabled and the temporary askpass file is removed.
# Upstream source and license are retained; public timestamp services are mocked.
