name: Harmonie software verification

on:
  pull_request:
    paths:
      - 'prototypes/harmonie/**'
      - 'tools/harmonie/**'
      - 'scripts/ci/verify-harmonie.py'
      - '.github/workflows/harmonie-verification.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/harmonie/**'
      - 'tools/harmonie/**'
      - 'scripts/ci/verify-harmonie.py'
      - '.github/workflows/harmonie-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonie-software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install only the numerical test dependencies
        run: |
          # Isolate indices from the runner's mirrorlist, whose HTTP Azure mirror
          # failed DNS resolution in run 43050012078. Keep Ubuntu signatures/TLS.
          # /tmp is traversable by APT's unprivileged acquisition user.
          apt_dir=$(mktemp -d /tmp/harmonie-apt.XXXXXX)
          chmod 755 "$apt_dir"
          mkdir -p "$apt_dir/lists/partial" "$apt_dir/sourceparts"
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          cat > "$apt_dir/ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$apt_dir/sourceparts"
            -o "Dir::State::lists=$apt_dir/lists"
            -o Acquire::Retries=1
            -o Acquire::https::Timeout=20
            -o APT::Update::Error-Mode=any
          )
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" update \
            2>&1 | tee "$RUNNER_TEMP/harmonie-apt-update.log"
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install \
            --no-install-recommends --yes ffmpeg \
            2>&1 | tee "$RUNNER_TEMP/harmonie-apt-install.log"
          python -m pip --isolated install --disable-pip-version-check --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --report "$RUNNER_TEMP/harmonie-dependencies.json" \
            'numpy==2.3.5' 'scipy==1.17.0'

      - name: Verify the existing Harmonie software checks without skips
        run: |
          python scripts/ci/verify-harmonie.py \
            --output "$RUNNER_TEMP/harmonie-software-evidence"

      - name: Preserve commands, reports and source fingerprints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harmonie-software-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harmonie-apt-*.log
            ${{ runner.temp }}/harmonie-dependencies.json
            ${{ runner.temp }}/harmonie-software-evidence/*.json
            ${{ runner.temp }}/harmonie-software-evidence/*.log
          if-no-files-found: warn
          retention-days: 7
