name: MUKTI scoped dependency candidate 20261031

on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths: ['.github/workflows/mukti-glob-candidate-20261031.yml']

permissions:
  contents: read
concurrency:
  group: mukti-glob-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.repository == 'puramapro-oss/mukti' && github.ref == 'refs/heads/audit/mukti-hardware-compat-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare a scoped candidate without changing direct dependency versions
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-candidate'
          root.mkdir()
          for name in ['package.json','package-lock.json']:
              (root/('before-'+name)).write_bytes(pathlib.Path(name).read_bytes())
          p=pathlib.Path('package.json'); data=json.loads(p.read_text())
          assert 'rimraf' not in data.get('overrides',{})
          data.setdefault('overrides',{})['rimraf']={'glob':{'.':'14.0.2','minimatch':'11.0.1'}}
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Resolve and install candidate with lifecycle scripts disabled
        env:
          GH_PRIVATE_DEPS_TOKEN: ${{ secrets.GH_PRIVATE_DEPS_TOKEN }}
        run: |
          set -eu
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          if [ -n "${GH_PRIVATE_DEPS_TOKEN:-}" ]; then
            askpass="$(mktemp "$RUNNER_TEMP/mukti-askpass.XXXXXX")"
            trap 'rm -f "$askpass"' EXIT
            cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            "Username for 'https://github.com':"*|"Username for 'https://github.com/"*) printf '%s\n' 'x-access-token' ;;
            "Password for 'https://x-access-token@github.com':"*|"Password for 'https://x-access-token@github.com/"*) printf '%s\n' "$GH_PRIVATE_DEPS_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
            chmod 700 "$askpass"
            export GIT_ASKPASS="$askpass"
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify that direct locked versions and shared memory did not drift
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-candidate'
          before=json.loads((root/'before-package.json').read_text())
          after=json.loads(pathlib.Path('package.json').read_text())
          old=json.loads((root/'before-package-lock.json').read_text())['packages']
          new=json.loads(pathlib.Path('package-lock.json').read_text())['packages']
          for section in ['dependencies','devDependencies']:
              assert before[section]==after[section]
              for name in before[section]:
                  key='node_modules/'+name
                  for field in ['version','resolved','integrity']:
                      assert old[key].get(field)==new[key].get(field),(name,field)
          assert old['node_modules/@purama/smarana']['resolved']==new['node_modules/@purama/smarana']['resolved']
          diff={key:{'before':old.get(key),'after':new.get(key)} for key in sorted(set(old)|set(new)) if old.get(key)!=new.get(key)}
          (root/'lock-diff.json').write_text(json.dumps(diff,indent=2)+'\n')
          print(json.dumps({'directVersionsUnchanged':True,'changedLockEntries':list(diff)}))
          PY
      - name: Verify candidate installed versions and filesystem compatibility
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { mkdtemp, mkdir, writeFile, readFile, access, rm } from 'node:fs/promises';
          import path from 'node:path';
          const require=createRequire(import.meta.url);
          const capRequire=createRequire(require.resolve('@capacitor/cli/package.json'));
          const rimrafRequire=createRequire(capRequire.resolve('rimraf'));
          const globRequire=createRequire(rimrafRequire.resolve('glob'));
          const glob=rimrafRequire('glob');
          const rimraf=capRequire('rimraf');
          const versions={capacitor:require('@capacitor/cli/package.json').version,glob:rimrafRequire('glob/package.json').version,minimatch:globRequire('minimatch/package.json').version};
          assert.equal(versions.glob,'14.0.2');
          assert.equal(versions.minimatch,'11.0.1');
          const root=await mkdtemp(path.join(process.env.RUNNER_TEMP,'mukti-glob-smoke-'));
          try {
            await mkdir(path.join(root,'nested'));
            await writeFile(path.join(root,'keep.txt'),'keep');
            await writeFile(path.join(root,'nested','remove.tmp'),'remove');
            await writeFile(path.join(root,'nested','keep.txt'),'keep');
            const files=await glob.glob('**/*.txt',{cwd:root,nodir:true});
            assert.deepEqual(files.sort(),['keep.txt','nested/keep.txt']);
            const c=new AbortController(); c.abort(new Error('controlled-cancellation'));
            await assert.rejects(glob.glob('**/*',{cwd:root,signal:c.signal}));
            await rimraf.rimraf(path.join(root,'nested','*.tmp'),{glob:true});
            await assert.rejects(access(path.join(root,'nested','remove.tmp')));
            assert.equal(await readFile(path.join(root,'nested','keep.txt'),'utf8'),'keep');
            await rimraf.rimraf(path.join(root,'nested'));
            await assert.rejects(access(path.join(root,'nested')));
            assert.equal(await readFile(path.join(root,'keep.txt'),'utf8'),'keep');
            console.log(JSON.stringify({versions,filesystemSmoke:'PASS',scope:'only generated temporary files; not a native iOS/Android build'}));
          } finally { await rm(root,{recursive:true,force:true}); }
          JS
          ./node_modules/.bin/cap --version
      - name: Typecheck and lint the whole candidate without weakening rules
        run: |
          ./node_modules/.bin/tsc --noEmit --pretty false
          npm run lint -- --max-warnings=0
      - name: Build candidate and test timestamp security
        run: |
          npm run build
          node --test tests/security-regression/opentimestamps-regression.mjs
      - name: Exercise all independent functional suites
        working-directory: tests/aurora-regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --test transport-regression.mjs audio-regression.mjs completion-wiring.mjs mediapipe-regression.mjs nature-regression.mjs remote-listening-client.mjs remote-listening-server.mjs remote-listening-ui.mjs pure-tone-regression.mjs tone-route-regression.mjs
          npm run typecheck
      - name: Require zero production dependency advisories
        run: |
          npm audit --package-lock-only --omit=dev --audit-level=low --json > "$RUNNER_TEMP/mukti-candidate/audit.json"
          node - <<'JS'
          const fs=require('node:fs'); const assert=require('node:assert/strict');
          const audit=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mukti-candidate/audit.json','utf8'));
          assert.equal(audit.metadata.vulnerabilities.total,0);
          console.log(JSON.stringify(audit.metadata));
          JS
      - name: Package verified candidate without tokens, dependencies or private source
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-verified'
          root.mkdir()
          metadata={'commit':os.environ['GITHUB_SHA'],'files':{},'scope':'candidate only; no ref update, deployment or hardware validation'}
          for name in ['package.json','package-lock.json']:
              data=pathlib.Path(name).read_bytes()
              (root/name).write_bytes(data)
              metadata['files'][name]=hashlib.sha256(data).hexdigest()
          (root/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-candidate'
          for name in ['audit.json','lock-diff.json']:
              shutil.copyfile(source/name,root/name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mukti-glob-verified-${{ github.sha }}
          path: ${{ runner.temp }}/mukti-verified/
          retention-days: 7
          if-no-files-found: error

  retain-blobs:
    needs: evaluate
    if: github.repository == 'puramapro-oss/mukti' && github.ref == 'refs/heads/audit/mukti-hardware-compat-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # Fresh runner: no checkout, dependency installation, application execution or private-dependency secret.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mukti-glob-verified-${{ github.sha }}
          path: verified
      - name: Retain only two verified immutable Git blobs; never update any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('verified')
          metadata=json.loads((root/'metadata.json').read_text())
          assert metadata['commit']==os.environ['GITHUB_SHA']
          assert set(metadata['files'])=={'package.json','package-lock.json'}
          results={}
          for name,digest in metadata['files'].items():
              p=root/name
              assert not p.is_symlink() and p.stat().st_size<2000000
              data=p.read_bytes(); assert hashlib.sha256(data).hexdigest()==digest
              json.loads(data)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/puramapro-oss/mukti/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==expected
              results[name]={'gitBlob':expected,'sha256':digest}
          print(json.dumps({'verifiedCandidateBlobs':results,'branchUpdated':False}))
          PY

# One-off candidate evaluation. The separate retention job may append immutable blobs only.
# It does not move refs, create a release, deploy, change product outputs or touch production data.
# Reviewed adoption and removal of this temporary workflow remain separate connector actions.
