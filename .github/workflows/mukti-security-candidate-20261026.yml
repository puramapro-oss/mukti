name: MUKTI security candidate 20261026
on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths: ['.github/workflows/mukti-security-candidate-20261026.yml']
permissions:
  contents: read
concurrency:
  group: mukti-security-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.repository == 'puramapro-oss/mukti' && github.ref == 'refs/heads/audit/mukti-hardware-compat-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only immutable reviewed public blobs; never refs.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Record original security gate without concealing its status
        run: |
          mkdir -p "$RUNNER_TEMP/mukti-security-evidence"
          set +e
          npm audit --package-lock-only --omit=dev --json > "$RUNNER_TEMP/mukti-security-evidence/audit-before.json"
          result=$?
          set -e
          echo "Baseline security audit exit: $result"
      - name: Prepare exact reviewed source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          sources={
            'src/lib/opentimestamps.ts':'76348bd7a4ac71ad67e39b79e699786e0548f756',
            'src/lib/opentimestamps-network.ts':'21013fef9996ecfb58ddd72df926b0222e304124',
            'tests/security-regression/opentimestamps-regression.mjs':'170450d67cef5515a5b22ae0c56e3053060ee995',
            'scripts/build-reviewed-opentimestamps.cjs':'fc9acb07dd130499e6cd7a49f850a1c0adda9087',
          }
          for name,sha in sources.items():
              req=urllib.request.Request('https://api.github.com/repos/puramapro-oss/mukti/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              data=base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              p=pathlib.Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          manifest=json.loads(pathlib.Path('package.json').read_text())
          assert manifest['dependencies'].pop('javascript-opentimestamps')=='^0.4.5'
          manifest['dependencies']['@opentimestamps/typescript-opentimestamps']='file:vendor/typescript-opentimestamps-upstream-12ba7b2.tgz'
          manifest['dependencies']['@anthropic-ai/sdk']='0.91.1'
          pathlib.Path('package.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('src/types/javascript-opentimestamps.d.ts').unlink()
          lock=json.loads(pathlib.Path('package-lock.json').read_text())
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-security-evidence'
          (evidence/'private-reference-before.json').write_text(json.dumps(lock['packages']['node_modules/@purama/smarana']['resolved']))
          PY
      - name: Build and retain exact upstream source and license without lifecycle scripts
        run: node scripts/build-reviewed-opentimestamps.cjs
      - name: Resolve candidate lock and install without lifecycle scripts
        id: install
        env:
          GH_PRIVATE_DEPS_TOKEN: ${{ secrets.GH_PRIVATE_DEPS_TOKEN }}
        run: |
          set -eu
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          test -n "${GH_PRIVATE_DEPS_TOKEN:-}"
          askpass="$(mktemp "$RUNNER_TEMP/mukti-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            "Username for 'https://github.com':"*|"Username for 'https://github.com/"*) printf '%s\n' 'x-access-token' ;;
            "Password for 'https://x-access-token@github.com':"*|"Password for 'https://x-access-token@github.com/"*) printf '%s\n' "$GH_PRIVATE_DEPS_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const old=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mukti-security-evidence/private-reference-before.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(lock.packages['node_modules/@purama/smarana'].resolved,old,'Private dependency must not change');
          for(const name of ['javascript-opentimestamps','request','web3','bitcore-lib']) assert.ok(!lock.packages['node_modules/'+name], 'Legacy chain still present: '+name);
          JS
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate actual timestamp implementation and failure boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/security-regression/opentimestamps-regression.mjs
      - name: Typecheck whole application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Lint all candidate code with existing rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0
      - name: Build whole application without deployment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Run existing isolated regressions and test typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --test transport-regression.mjs audio-regression.mjs completion-wiring.mjs mediapipe-regression.mjs nature-regression.mjs
          npm run typecheck
      - name: Require zero candidate production dependency advisories
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npm audit --package-lock-only --omit=dev --audit-level=low --json > "$RUNNER_TEMP/mukti-security-evidence/audit-after.json"
          result=$?
          set -e
          node - <<'JS'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mukti-security-evidence/audit-after.json','utf8'));
          console.log(JSON.stringify({metadata:report.metadata,error:report.error,vulnerabilities:report.vulnerabilities},null,2));
          JS
          exit "$result"
      - name: Stage tested public blobs only, with no branch or deployment update
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          paths=['package.json','package-lock.json','src/lib/opentimestamps.ts','src/lib/opentimestamps-network.ts','tests/security-regression/opentimestamps-regression.mjs','scripts/build-reviewed-opentimestamps.cjs','vendor/typescript-opentimestamps-upstream-12ba7b2.tgz','vendor/typescript-opentimestamps-provenance.json']
          results={}
          for name in paths:
              data=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/puramapro-oss/mukti/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==expected
              results[name]={'blob':expected,'sha256':hashlib.sha256(data).hexdigest()}
          metadata={'base':os.environ['GITHUB_SHA'],'files':results,'deleted':['src/types/javascript-opentimestamps.d.ts'],'scope':'Tested source candidate only; no release, live service validation or hardware test'}
          print(json.dumps(metadata,indent=2))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-security-evidence'/'candidate-blobs.json').write_text(json.dumps(metadata,indent=2))
          PY
      - name: Preserve public candidate and security evidence even on failure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import os,pathlib,zipfile
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-security-evidence'
          with zipfile.ZipFile(evidence/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in ['package.json','package-lock.json','src/lib/opentimestamps.ts','src/lib/opentimestamps-network.ts','tests/security-regression/opentimestamps-regression.mjs','scripts/build-reviewed-opentimestamps.cjs','vendor/typescript-opentimestamps-upstream-12ba7b2.tgz','vendor/typescript-opentimestamps-provenance.json']:
                  archive.write(name,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: mukti-security-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/mukti-security-evidence/
          retention-days: 14
          if-no-files-found: error
# Temporary evaluation only. No ref write, force push, production service credentials,
# hardware output or bypass of the existing permanent read-only release gates.
