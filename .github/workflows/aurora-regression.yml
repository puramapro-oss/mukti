name: AURORA isolated regression

on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths:
      - 'src/components/aurora/**'
      - 'src/components/reprogrammation/**'
      - 'src/components/exorcisme/hooks/**'
      - 'src/lib/ar/mediapipe-loader.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/aurora*'
      - 'src/lib/constants/aurora.ts'
      - 'src/hooks/useReducedMotion.ts'
      - 'tests/aurora-regression/**'
      - 'tsconfig.json'
      - 'migrations/20261023_aurora_atomic_completion.sql'
      - '.github/workflows/aurora-regression.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aurora-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated locked test dependencies (no install scripts)
        working-directory: tests/aurora-regression
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run React regression suite and completion validation
        working-directory: tests/aurora-regression
        run: npm test -- --reporter=verbose
      - name: Run transport, audio and server-wiring fault injection
        working-directory: tests/aurora-regression
        run: node --test transport-regression.mjs audio-regression.mjs completion-wiring.mjs mediapipe-regression.mjs
      - name: Typecheck tested production modules and the independent test workspace
        working-directory: tests/aurora-regression
        run: npm run typecheck
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Audit isolated test dependency lock
        working-directory: tests/aurora-regression
        run: npm audit --package-lock-only --audit-level=high

  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Audit application lock (not an application build)
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  database-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mukti-regression-only
          POSTGRES_DB: mukti_regression
        ports:
          - '127.0.0.1:54329:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify atomic completion on disposable PostgreSQL only
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '54329'
          PGUSER: postgres
          PGPASSWORD: mukti-regression-only
          PGDATABASE: mukti_regression
        run: python3 tests/aurora-regression/database_regression.py

# No deployment, no production APIs, no physical output and no project secrets.
# PostgreSQL contains generated test identities only and is destroyed with the job.
# The test workspace has its own lock and tsconfig, and remains typechecked here
# when the application tsconfig changes; it is not part of the Next.js build.
