name: MUKTI dependency candidate evaluation

on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths: ['.github/workflows/mukti-dependency-evaluation.yml', 'tests/aurora-regression/night-player.test.tsx']

permissions:
  contents: read
concurrency:
  group: mukti-dependency-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.repository == 'puramapro-oss/mukti' && github.ref == 'refs/heads/audit/mukti-hardware-compat-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare reviewed candidate and verify its exact dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-stabilization-20261025.py
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,urllib.request
          sha='9d62faeabc83627909d8c8851ff66f5d7649f8af'
          req=urllib.request.Request('https://api.github.com/repos/puramapro-oss/mukti/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: blob=json.load(response)
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          old=json.loads(pathlib.Path('package-lock.json').read_text())
          candidate=json.loads(data)
          assert old['packages']['node_modules/@purama/smarana']['resolved']==candidate['packages']['node_modules/@purama/smarana']['resolved']
          pathlib.Path('package-lock.json').write_bytes(data)
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-evidence'
          evidence.mkdir()
          patterns={'bioresonance':r'bio[-\s]?r[eé]sonance','biofeedback':r'bio[-\s]?feedback','spooky':r'spooky','hardware_transport':r'navigator\.(?:usb|serial|bluetooth)'}
          inventory={key:[] for key in patterns}
          for path in sorted(pathlib.Path('src').rglob('*')):
              if path.suffix not in ('.ts','.tsx','.js','.jsx'): continue
              text=path.read_text(encoding='utf-8')
              for key,pattern in patterns.items():
                  lines=[i for i,line in enumerate(text.splitlines(),1) if re.search(pattern,line,re.I)]
                  if lines: inventory[key].append({'path':str(path),'lines':lines})
          print(json.dumps({'source_inventory':inventory,'scope':'lexical inventory of src only; not a hardware or clinical test'},ensure_ascii=False))
          (evidence/'source-inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2))
          PY
      - name: Install exact application candidate without lifecycle scripts
        id: install
        env:
          GH_PRIVATE_DEPS_TOKEN: ${{ secrets.GH_PRIVATE_DEPS_TOKEN }}
        run: |
          set -eu
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          test -n "${GH_PRIVATE_DEPS_TOKEN:-}"
          askpass="$(mktemp "$RUNNER_TEMP/mukti-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            "Username for 'https://github.com':"*|"Username for 'https://github.com/"*) printf '%s\n' 'x-access-token' ;;
            "Password for 'https://x-access-token@github.com':"*|"Password for 'https://x-access-token@github.com/"*) printf '%s\n' "$GH_PRIVATE_DEPS_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independent regression environment
        id: test_install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Demonstrate the new voice regression before applying its correction
        id: reproduce
        if: ${{ !cancelled() && steps.test_install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: |
          set +e
          npm test -- night-player.test.tsx --reporter=json --outputFile="$RUNNER_TEMP/mukti-evidence/night-before.json"
          result=$?
          set -e
          node - "$result" <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mukti-evidence/night-before.json','utf8'));
          const failures = report.testResults.flatMap(suite => suite.assertionResults || []).filter(test => test.status === 'failed');
          assert.equal(Number(process.argv[2]), 1, 'The targeted pre-fix regression must fail');
          assert.ok(failures.some(test => test.fullName.includes('does not replay a voice cue')), 'Failure must reproduce the voice regression, not a setup error');
          console.log(JSON.stringify({expectedPreFixFailures:failures.map(test=>test.fullName)}));
          JS
      - name: Correct the observed render state and callback dependency defects
        id: correction
        if: ${{ !cancelled() && steps.reproduce.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def replace(path,old,new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise RuntimeError('Unexpected source: '+path)
              p.write_text(text.replace(old,new))
          path='src/components/reprogrammation/NightPlayer.tsx'
          replace(path,'  const [currentIndex, setCurrentIndex] = useState(0)','  const [currentIndex, setCurrentIndex] = useState(0)\n  const [playedCount, setPlayedCount] = useState(0)\n  const currentIndexRef = useRef(0)')
          old="""      setCurrentIndex((i) => {
                  const next = (i + 1) % affirmations.length
                  const a = affirmations[next]
                  if (a) playedIdsRef.current.add(a.id.replace(/^custom-/, ''))
                  speakAffirmation(a, voiceEnabled, VOICE_VOLUME)
                  return next
                })"""
          # Normalize only indentation in this literal, not in the source.
          old=old.replace('\n            ','\n')
          new="""      // Effects belong to the timer callback, never to a replayable state updater.
                const next = (currentIndexRef.current + 1) % affirmations.length
                currentIndexRef.current = next
                setCurrentIndex(next)
                const a = affirmations[next]
                if (a) {
                  playedIdsRef.current.add(a.id.replace(/^custom-/, ''))
                  setPlayedCount(playedIdsRef.current.size)
                }
                speakAffirmation(a, voiceEnabled, VOICE_VOLUME)"""
          new=new.replace('\n          ','\n')
          replace(path,old,new)
          replace(path,'      setCurrentIndex(0)','      currentIndexRef.current = 0\n      setCurrentIndex(0)')
          replace(path,"      playedIdsRef.current = new Set([data.affirmations[0].id.replace(/^custom-/, '')])","      playedIdsRef.current = new Set([data.affirmations[0].id.replace(/^custom-/, '')])\n      setPlayedCount(playedIdsRef.current.size)")
          replace(path,"{playedIdsRef.current.size} lue{playedIdsRef.current.size > 1 ? 's' : ''}","{playedCount} lue{playedCount > 1 ? 's' : ''}")
          path='src/components/exorcisme/hooks/useExorcismeSession.ts'
          replace(path,'  const sendComplete = useCallback(','  const { snapshotPhaseDurations, startTsRef } = phaseData\n\n  const sendComplete = useCallback(')
          replace(path,'phaseData.snapshotPhaseDurations(now)','snapshotPhaseDurations(now)')
          replace(path,'(now - phaseData.startTsRef.current)','(now - startTsRef.current)')
          replace(path,'[phaseData.snapshotPhaseDurations, phaseData.startTsRef, tapsRef, affirmationFrRef]','[snapshotPhaseDurations, startTsRef, tapsRef, affirmationFrRef]')
          print(json.dumps({'corrected':['night-player reactive count','single timer-side voice cue','consistent callback dependencies']}))
          PY
      - name: Typecheck complete candidate application
        id: typecheck
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Build candidate without production credentials or deployment
        id: build
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        run: npm run build
      - name: Lint all application and test sources without weakening rules
        id: lint
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0
      - name: Execute all React regression tests after correction
        id: react_tests
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm test
      - name: Execute transport audio server and model lifecycle regressions
        id: node_tests
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: node --test transport-regression.mjs audio-regression.mjs completion-wiring.mjs mediapipe-regression.mjs
      - name: Typecheck regression sources
        id: test_types
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm run typecheck
      - name: Audit candidate production dependencies without hiding failures
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npm audit --package-lock-only --omit=dev --audit-level=high --json > "$RUNNER_TEMP/mukti-evidence/dependency-audit.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/mukti-evidence/dependency-audit.json"
          exit "$status"
      - name: Preserve only public candidate sources and verification metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'mukti-evidence'
          paths=set(json.loads(pathlib.Path('tests/aurora-regression/stabilization-changes.json').read_text()))
          paths.update(['package-lock.json','tests/aurora-regression/night-player.test.tsx','.github/workflows/mukti-dependency-evaluation.yml','src/lib/aurora-audio.ts'])
          metadata={'commit':os.environ['GITHUB_SHA'],'scope':'public source candidate; not a release, hardware test or clinical validation','files':{},'deleted':[]}
          with zipfile.ZipFile(evidence/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(paths):
                  p=pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ('src','tests','.github') or name in ('package.json','package-lock.json','eslint.config.mjs')
                  if not p.exists(): metadata['deleted'].append(name); continue
                  data=p.read_bytes()
                  metadata['files'][name]=hashlib.sha256(data).hexdigest()
                  archive.writestr(name,data)
          (evidence/'candidate-metadata.json').write_text(json.dumps(metadata,indent=2))
          PY
      - name: Retain diagnostic evidence even when the security audit fails
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mukti-candidate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/mukti-evidence/
          retention-days: 14
          if-no-files-found: error

# Diagnostic candidate only. No ref updates, deployment, production database writes,
# hardware output, fabricated biometrics or therapeutic bioresonance claims.
