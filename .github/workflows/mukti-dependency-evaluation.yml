name: MUKTI dependency candidate evaluation

on:
  push:
    branches: ['audit/mukti-hardware-compat-20261023']
    paths: ['.github/workflows/mukti-dependency-evaluation.yml']

permissions:
  contents: read
concurrency:
  group: mukti-dependency-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.repository == 'puramapro-oss/mukti' && github.ref == 'refs/heads/audit/mukti-hardware-compat-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare exact reviewed candidate and verify the existing lock blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-stabilization-20261025.py
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          sha='9d62faeabc83627909d8c8851ff66f5d7649f8af'
          req=urllib.request.Request('https://api.github.com/repos/puramapro-oss/mukti/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as response: blob=json.load(response)
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          old=json.loads(pathlib.Path('package-lock.json').read_text())
          candidate=json.loads(data)
          assert old['packages']['node_modules/@purama/smarana']['resolved']==candidate['packages']['node_modules/@purama/smarana']['resolved']
          pathlib.Path('package-lock.json').write_bytes(data)
          PY
      - name: Install exact application candidate without lifecycle scripts
        id: install
        env:
          GH_PRIVATE_DEPS_TOKEN: ${{ secrets.GH_PRIVATE_DEPS_TOKEN }}
        run: |
          set -eu
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          test -n "${GH_PRIVATE_DEPS_TOKEN:-}"
          askpass="$(mktemp "$RUNNER_TEMP/mukti-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            "Username for 'https://github.com':"*|"Username for 'https://github.com/"*) printf '%s\n' 'x-access-token' ;;
            "Password for 'https://x-access-token@github.com':"*|"Password for 'https://x-access-token@github.com/"*) printf '%s\n' "$GH_PRIVATE_DEPS_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck candidate application
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Build candidate application without production credentials
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Lint all application and test sources with unchanged rules
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0
      - name: Install independent regression environment
        id: test_install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute real React hooks and existing regression suite
        id: react_tests
        if: ${{ !cancelled() && steps.test_install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm test
      - name: Execute transport audio server and model lifecycle regressions
        id: node_tests
        if: ${{ !cancelled() && steps.test_install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: node --test transport-regression.mjs audio-regression.mjs completion-wiring.mjs mediapipe-regression.mjs
      - name: Typecheck regression sources
        id: test_types
        if: ${{ !cancelled() && steps.test_install.outcome == 'success' }}
        working-directory: tests/aurora-regression
        run: npm run typecheck
      - name: Audit candidate production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Store exact candidate tree for connector review without updating any branch
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.react_tests.outcome == 'success' && steps.node_tests.outcome == 'success' && steps.test_types.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='puramapro-oss/mukti'
          assert os.environ['GITHUB_REF']=='refs/heads/audit/mukti-hardware-compat-20261023'
          base='https://api.github.com/repos/puramapro-oss/mukti/git/'
          def post(endpoint,payload):
              request=urllib.request.Request(base+endpoint,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response: return json.load(response)
          paths=set(json.loads(pathlib.Path('tests/aurora-regression/stabilization-changes.json').read_text()))
          paths.add('package-lock.json')
          entries=[]
          for name in sorted(paths):
              file=pathlib.Path(name)
              sha=None
              if file.exists():
                  data=file.read_bytes()
                  assert os.environ['GH_TOKEN'].encode() not in data
                  sha=post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              print(json.dumps({'path':name,'sha':sha}))
          for name in ['scripts/prepare-stabilization-20261025.py','.github/workflows/mukti-dependency-evaluation.yml']:
              entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          tree=post('trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          print(json.dumps({'candidate_tree':tree['sha'],'parent':os.environ['GITHUB_SHA']}))
          PY

# No ref changes, deployment, production migration or physical output.
# Remaining security failures stay visible; the reviewed output tree removes this temporary write job.
